<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quotation Maker – Fluid Power Hydraulics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#1c2033;--mute:#6b7186;--line:#dfe2ea;--navy:#1b2040;--red:#b3202d;--red-d:#8f1823;--soft:#eef0f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151f;--card:#1c1f2e;--ink:#eceef6;--mute:#9aa0b8;--line:#2e3247;--soft:#262a3d;--red:#d8404d;--red-d:#e5606b}}
:root[data-theme="dark"]{--bg:#13151f;--card:#1c1f2e;--ink:#eceef6;--mute:#9aa0b8;--line:#2e3247;--soft:#262a3d;--red:#d8404d;--red-d:#e5606b}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.bar h1{font-size:16px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.tab:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-d)}
.btn.ghost{background:transparent;color:#fff;border-color:#ffffff40}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--red)}
.tabs{display:none;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:4}
.tab{flex:1;padding:12px;border:0;background:none;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected=true]{color:var(--red);border-color:var(--red)}
.wrap{display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);gap:18px;max-width:1400px;margin:0 auto;padding:16px;align-items:start}
.editor{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.card>summary,.card>h2{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:15px;margin:0;display:flex;justify-content:space-between;align-items:center}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"+";font-size:20px;color:var(--mute);font-weight:500}
.card[open]>summary::after{content:"–"}
.body{padding:0 16px 16px;display:grid;gap:12px}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--mute)}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 11px;font-size:15px}
textarea{resize:vertical;min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--soft)}
.item .hd{display:flex;align-items:center;gap:6px}
.item .hd b{flex:1;font-size:14px}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px}
.term{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:start}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--red)}
.hint{font-size:12px;color:var(--mute);margin:0}
.saved{display:grid;gap:8px}
.saved .s{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.saved .s span{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview{background:#d9dce6;border-radius:14px;padding:14px;overflow:hidden}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .preview{background:#0d0f17}}
#stage{width:100%;position:relative}
.paper{width:794px;min-height:1123px;background:#fff;color:#111;font:13px/1.45 Arial,Helvetica,sans-serif;position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;box-shadow:0 6px 24px #0003}
.p-in{padding:34px 54px 20px;flex:1}
.lh{display:flex;justify-content:space-between;align-items:flex-start}
.lh .logo{height:62px}.lh .badge{height:66px}
.contact{display:flex;justify-content:space-between;border-bottom:2px solid #222;margin-top:10px;padding-bottom:5px;font-size:13px;font-weight:600;gap:10px}
.meta{display:flex;justify-content:space-between;margin:22px 0 14px;font-size:12px;font-weight:700}
.to{font-weight:700;font-size:12px;line-height:1.35}
.p-in p{margin:12px 0}
.p-in .sub{font-weight:700}
table.it{width:100%;border-collapse:collapse;margin:14px 0 10px;font-size:12px}
.it th,.it td{border:1px solid #333;padding:7px 8px;vertical-align:middle}
.it th{font-weight:600;text-align:center;font-size:12.5px}
.it td.c{text-align:center;font-weight:700}.it td.r{text-align:right;font-weight:700;white-space:nowrap}
.it td.d{font-weight:700;line-height:1.55;vertical-align:top}
.it tr.tot td{font-weight:700;border-top:1px solid #333}
.it .lbl{text-align:right}
.note{font-weight:700;font-size:12px;margin:12px 0}
.tt{font-weight:700;text-decoration:underline;font-size:12px;margin:14px 0 6px}
.terms{display:grid;grid-template-columns:auto 1fr;gap:1px 14px;font-size:12px;font-weight:700}
.closing{margin-top:18px;font-weight:700;font-size:12px;white-space:pre-line}
.sig{position:relative;height:96px;margin-top:2px}
.sig img{position:absolute;left:150px;top:-4px;height:96px;opacity:.85}
.sig div{position:absolute;left:0;bottom:6px;font-weight:700;font-size:12px}
.foot{background:#1b2040;color:#fff;padding:18px 54px 20px;font-size:13.5px;letter-spacing:.2px;clip-path:polygon(0 18px,100% 0,100% 100%,0 100%);padding-top:34px;margin-top:16px}
.empty{color:#999;font-style:italic;font-weight:400}
@media (max-width:860px){
 .wrap{grid-template-columns:1fr;padding:12px}
 .tabs{display:flex}
 body[data-tab=edit] .preview,body[data-tab=prev] .editor{display:none}
 .bar .btn.ghost span{display:none}
}
@media print{
 @page{size:A4;margin:0}
 html,body{background:#fff}
 .bar,.tabs,.editor{display:none!important}
 .wrap{display:block;padding:0;max-width:none}
 .preview{padding:0;background:none;display:block!important;border-radius:0}
 #stage{height:auto!important}
 .paper{position:static;transform:none!important;box-shadow:none;width:210mm;min-height:297mm}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body data-tab="edit">
<header class="bar">
 <h1>Quotation Maker</h1>
 <button class="btn ghost sm" id="bNew" title="Start a new quotation">New</button>
 <button class="btn pri sm" id="bPrint">Print / Save PDF</button>
</header>
<div class="tabs" role="tablist">
 <button class="tab" role="tab" aria-selected="true" data-t="edit">Edit</button>
 <button class="tab" role="tab" aria-selected="false" data-t="prev">Preview</button>
</div>

<main class="wrap">
<section class="editor" aria-label="Quotation details">

 <details class="card" open><summary>Reference and customer</summary><div class="body">
  <div class="row">
   <label>Reference no.<input data-k="ref"></label>
   <label>Date<input type="date" data-k="date"></label>
  </div>
  <label>Customer address<textarea data-k="to" rows="5"></textarea></label>
  <label>Subject line<textarea data-k="subject" rows="2"></textarea></label>
  <label>Opening line<textarea data-k="intro" rows="2"></textarea></label>
 </div></details>

 <details class="card" open><summary>Items</summary><div class="body">
  <div id="items" style="display:grid;gap:10px"></div>
  <button class="btn" id="addItem">Add item</button>
  <label class="chk"><input type="checkbox" data-k="showTotals"> Show amount column, GST and total</label>
  <div id="gstRow" class="row" hidden>
   <label>GST %<input type="number" inputmode="decimal" data-k="gst" min="0" step="0.5"></label>
   <label>Total label<input data-k="totLabel"></label>
  </div>
  <label>Note under table<textarea data-k="note" rows="2"></textarea></label>
 </div></details>

 <details class="card"><summary>Terms and conditions</summary><div class="body">
  <div id="terms" style="display:grid;gap:8px"></div>
  <button class="btn" id="addTerm">Add term</button>
 </div></details>

 <details class="card"><summary>Closing, signature, footer</summary><div class="body">
  <label>Closing text<textarea data-k="closing" rows="5"></textarea></label>
  <label class="chk"><input type="checkbox" data-k="stamp"> Show company stamp and signature</label>
  <div class="row">
   <label>Phone<input data-k="phone"></label>
   <label>Email<input data-k="email"></label>
  </div>
  <label>Footer address<textarea data-k="footer" rows="2"></textarea></label>
 </div></details>

 <details class="card"><summary>Saved quotations</summary><div class="body">
  <button class="btn pri" id="bSave">Save this quotation</button>
  <div class="saved" id="saved"></div>
  <p class="hint">Saved on this device and browser only.</p>
 </div></details>
</section>

<section class="preview" aria-label="Preview"><div id="stage"><div class="paper" id="paper"></div></div></section>
</main>

const KEY="fph-quotes-v1";
const blank=()=>({ref:"",date:new Date().toISOString().slice(0,10),to:"The Deputy General Manager,\nTurbine Maintenance (O&M)\nNeyveli New Thermal Power Plant,\nNLC India Ltd, Block-26,\nNeyveli - 607803",
 subject:"Budgetary offer for Repair and Reconditioning of LPBP Spary servo valve with spares.",
 intro:"With reference to the above, we are pleased to submit our offer as follows:",
 items:[{desc:"",qty:"",price:"",text:""}],showTotals:false,gst:18,totLabel:"Total (incl. GST)",
 note:"Transit Insurance, P&F Charges, Transports Charges our scope",
 terms:[{k:"Prices",v:"F.O.R.NLC Neyveli, GST 18% extra as applicable."},{k:"Payment",v:"100% within 30 days from the date of receipt of material at your end."},{k:"Validity",v:"30 days."},{k:"Delivery",v:"8 Weeks from the date of receipt of order at our end."},{k:"Warranty",v:"Rexroth warranty of 6 Month"}],
 closing:"We trust our offer is most competitive and we look forward to receiving your valuable order for prompt action at our end.\n\nThanking you,\n\nYours faithfully,\nFor Fluid Power Hydraulics",
 stamp:true,phone:"094443 96538 / 094443 96540",email:"hydraulics@fluidpowergroup.co.in",
 footer:"G2, Aravind Apartments, 116/21, Jawaharlal Nehru Road\n(100 Feet Road), Vadapalani, Chennai - 600 026"});
const sample=()=>{const s=blank();s.ref="FPH: NLC: 0229: 26";
 const m="Model: 4WS2EM10-5X/5B11ET315K31CV\nMNR - R901313732";
 s.items=[{desc:"Rexroth Servo Valve – SN- 6 & SN- 1\n"+m,qty:"2",price:"178626",text:""},{desc:"Rexroth Servo Valve – SN- 7\n"+m,qty:"1",price:"320887",text:""},{desc:"Rexroth Servo Valve – SN- 2\n"+m,qty:"",price:"",text:"Beyond the Repair"}];return s};
let S=load("cur")||sample();
function load(k){try{const r=localStorage.getItem(KEY+":"+k);return r?JSON.parse(r):null}catch(e){return null}}
function store(k,v){try{localStorage.setItem(KEY+":"+k,JSON.stringify(v))}catch(e){}}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nl=t=>esc(t).replace(/\n/g,"<br>");
const num=v=>{const n=parseFloat(String(v).replace(/,/g,""));return isNaN(n)?null:n};
const inr=n=>n.toLocaleString("en-IN",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const fdate=d=>{if(!d)return"";const[y,m,x]=d.split("-");return`${x}.${m}.${y}`};
const pad=n=>String(n).padStart(2,"0");

/* editor bindings */
function bindSimple(){
 $$("[data-k]").forEach(el=>{
  const k=el.dataset.k;
  if(el.type==="checkbox")el.checked=!!S[k];else el.value=S[k]??"";
  el.oninput=()=>{S[k]=el.type==="checkbox"?el.checked:el.value;if(k==="showTotals")$("#gstRow").hidden=!S.showTotals;changed()};
 });
 $("#gstRow").hidden=!S.showTotals;
}
function drawItems(){
 const box=$("#items");box.innerHTML="";
 S.items.forEach((it,i)=>{
  const d=document.createElement("div");d.className="item";
  d.innerHTML=`<div class="hd"><b>Item ${i+1}</b><button class="ibtn" data-a="up" aria-label="Move up">↑</button><button class="ibtn" data-a="dn" aria-label="Move down">↓</button><button class="ibtn" data-a="rm" aria-label="Remove item">✕</button></div>
  <label>Description<textarea rows="3" data-f="desc"></textarea></label>
  <div class="row"><label>Qty<input data-f="qty" inputmode="decimal"></label><label>Unit price (Rs.)<input data-f="price" inputmode="decimal"></label></div>
  <label>Or show text instead of price<input data-f="text" placeholder="e.g. Beyond the Repair"></label>`;
  d.querySelectorAll("[data-f]").forEach(e=>{e.value=it[e.dataset.f]||"";e.oninput=()=>{it[e.dataset.f]=e.value;changed()}});
  d.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
   const a=b.dataset.a;
   if(a==="rm")S.items.splice(i,1);
   else{const j=a==="up"?i-1:i+1;if(j<0||j>=S.items.length)return;[S.items[i],S.items[j]]=[S.items[j],S.items[i]]}
   drawItems();changed()});
  box.appendChild(d);
 });
}
function drawTerms(){
 const box=$("#terms");box.innerHTML="";
 S.terms.forEach((t,i)=>{
  const d=document.createElement("div");d.className="term";
  d.innerHTML=`<input data-f="k" aria-label="Term name"><textarea rows="2" data-f="v" aria-label="Term text" style="min-height:0"></textarea><button class="ibtn" aria-label="Remove term">✕</button>`;
  d.querySelectorAll("[data-f]").forEach(e=>{e.value=t[e.dataset.f]||"";e.oninput=()=>{t[e.dataset.f]=e.value;changed()}});
  d.querySelector("button").onclick=()=>{S.terms.splice(i,1);drawTerms();changed()};
  box.appendChild(d);
 });
}
$("#addItem").onclick=()=>{S.items.push({desc:"",qty:"",price:"",text:""});drawItems();changed()};
$("#addTerm").onclick=()=>{S.terms.push({k:"",v:""});drawTerms();changed()};

/* paper */
function render(){
 const T=S.showTotals;let sub=0;
 const rows=S.items.map((it,i)=>{
  const q=num(it.qty),p=num(it.price),txt=(it.text||"").trim();
  let amt="";
  if(!txt&&p!==null){const a=(q??1)*p;sub+=a;amt=inr(a)+"/-"}
  const price=txt?esc(txt):(p!==null?inr(p)+"/-":"");
  const qty=txt?"":(it.qty===""?"":esc(q!==null&&q<10&&Number.isInteger(q)?pad(q):it.qty));
  if(txt)return`<tr><td class="c">${i+1}.</td><td class="d">${nl(it.desc)}</td><td class="c" colspan="${T?3:2}">${price}</td></tr>`;
  return`<tr><td class="c">${i+1}.</td><td class="d">${nl(it.desc)}</td><td class="c">${qty}</td><td class="r">${price}</td>${T?`<td class="r">${amt}</td>`:""}</tr>`;
 }).join("");
 let tot="";
 if(T){const g=sub*(num(S.gst)||0)/100;
  tot=`<tr class="tot"><td colspan="4" class="lbl">Sub total</td><td class="r">${inr(sub)}/-</td></tr>
  <tr class="tot"><td colspan="4" class="lbl">GST @ ${esc(S.gst)}%</td><td class="r">${inr(g)}/-</td></tr>
  <tr class="tot"><td colspan="4" class="lbl">${esc(S.totLabel)}</td><td class="r">${inr(sub+g)}/-</td></tr>`}
 const terms=S.terms.filter(t=>t.k||t.v).map((t,i)=>`<div>${i+1}. ${esc(t.k)}</div><div>: ${nl(t.v)}</div>`).join("");
 $("#paper").innerHTML=`<div class="p-in">
  <div class="lh"><img class="logo" src="${IMG.logo}" alt="Fluid Power Hydraulics"><img class="badge" src="${IMG.badge}" alt="Rexroth certified excellence"></div>
  <div class="contact"><span>☎ ${esc(S.phone)}</span><span>✉ ${esc(S.email)}</span></div>
  <div class="meta"><span>REF: ${esc(S.ref)||'<span class="empty">add reference</span>'}</span><span>DT: ${fdate(S.date)}</span></div>
  <div class="to">${nl(S.to)}</div>
  <p>Dear Sir,</p>
  <p class="sub">Ref : ${nl(S.subject)}</p>
  <p class="sub">${nl(S.intro)}</p>
  <table class="it"><thead><tr><th style="width:52px">Sl. No.</th><th>Description</th><th style="width:80px">QTY<br>(NOS.)</th><th style="width:${T?96:120}px">Unit Price<br>Rs.</th>${T?'<th style="width:104px">Amount<br>Rs.</th>':""}</tr></thead><tbody>${rows}${tot}</tbody></table>
  ${S.note?`<div class="note">Note: ${nl(S.note)}</div>`:""}
  ${terms?`<div class="tt">TERMS &amp; CONDITIONS:-</div><div class="terms">${terms}</div>`:""}
  <div class="closing">${nl(S.closing).replace(/<br>/g,"\n")}</div>
  <div class="sig">${S.stamp?`<img src="${IMG.stamp}" alt="Stamp">`:""}<div>Authorized signatory</div></div>
 </div>
 <div class="foot">${nl(S.footer)}</div>`;
 fit();
}
function fit(){
 const st=$("#stage"),p=$("#paper");
 if(matchMedia("print").matches)return;
 const w=st.clientWidth,sc=Math.min(1,w/794);
 p.style.transform=`scale(${sc})`;
 st.style.height=(p.offsetHeight*sc)+"px";
}
addEventListener("resize",fit);
addEventListener("beforeprint",()=>{$("#paper").style.transform="none"});
addEventListener("afterprint",fit);

let tm;function changed(){render();clearTimeout(tm);tm=setTimeout(()=>store("cur",S),300)}

/* saved */
function list(){try{return JSON.parse(localStorage.getItem(KEY+":list")||"[]")}catch(e){return[]}}
function drawSaved(){
 const L=list(),box=$("#saved");
 box.innerHTML=L.length?"":'<p class="hint">Nothing saved yet.</p>';
 L.forEach((q,i)=>{
  const d=document.createElement("div");d.className="s";
  d.innerHTML=`<span>${esc(q.ref||"No ref")} · ${fdate(q.date)}</span><button class="btn sm">Open</button><button class="btn sm danger" aria-label="Delete">✕</button>`;
  const[b1,b2]=d.querySelectorAll("button");
  b1.onclick=()=>{S=JSON.parse(JSON.stringify(q));all();go("prev")};
  b2.onclick=()=>{L.splice(i,1);store("list",L);drawSaved()};
  box.appendChild(d);
 });
}
$("#bSave").onclick=()=>{
 const L=list(),i=L.findIndex(q=>q.ref&&q.ref===S.ref),c=JSON.parse(JSON.stringify(S));
 if(i>=0)L[i]=c;else L.unshift(c);
 store("list",L);drawSaved();$("#bSave").textContent="Saved ✓";setTimeout(()=>$("#bSave").textContent="Save this quotation",1400);
};
$("#bNew").onclick=()=>{
 if(!confirm("Start a new quotation? Your current one stays saved only if you used Save."))return;
 const b=blank();b.items=[{desc:"",qty:"",price:"",text:""}];S=b;all();go("edit");
};
$("#bPrint").onclick=()=>{
 go("prev");setTimeout(()=>{try{print()}catch(e){alert("Printing is blocked here. Open this page in your browser and try again.")}},150);
};
function go(t){document.body.dataset.tab=t;$$(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));setTimeout(fit,30);scrollTo(0,0)}
$$(".tab").forEach(b=>b.onclick=()=>go(b.dataset.t));
function all(){bindSimple();drawItems();drawTerms();drawSaved();render()}
all();
</script>
</body>
